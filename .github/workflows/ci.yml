name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: sneat-co/cicd/.github/workflows/nx-ci.yml@main
    with:
      working-directory: frontend
      targets: "lint build"
      coverage-command: pnpm exec nx run ext-template-contract:test --coverage
      coverage-path: coverage
      minimum-coverage: 100
      coverage-artifact-name: ext-template-contract-coverage
